<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Your Next Anime | Dreaming Anime</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap"><style>body{margin:0;background:#090909;color:#fff;font-family:Inter,sans-serif}.wrap{max-width:720px;margin:auto;padding:8vh 7%}.brand{color:#ff6b00;font:2rem Bangers;text-decoration:none}.eyebrow{font:700 .7rem Space Mono;color:#ff6b00;letter-spacing:.12em;margin-top:5rem}h1{font:clamp(3.4rem,11vw,6rem) Bangers;color:#ff6b00;line-height:.95;margin:.6rem 0 1rem}.sub{color:#aaa}.q{background:#151515;border:1px solid #292929;padding:1.3rem;margin:1.2rem 0}.q strong{display:block;margin-bottom:.8rem}.q label{display:block;color:#ccc;padding:.45rem 0}.button{background:#ff6b00;border:0;padding:13px 20px;font-weight:700;cursor:pointer}.result{display:none;border-left:4px solid #ff6b00;background:#151515;padding:1.2rem;margin-top:1.5rem}.result h2{font:2.5rem Bangers;color:#ff6b00;margin:.2rem 0}.back{color:#ff6b00;display:inline-block;margin-top:2rem}</style></head><body><main class="wrap"><a class="brand" href="../">DREAMING ANIME</a><div class="eyebrow">THE DREAMER QUIZ</div><h1>WHAT SHOULD YOU WATCH NEXT?</h1><p class="sub">Answer three quick questions and get a starting point for your next anime night.</p><form id="quiz"><div class="q"><strong>1. What mood are you in?</strong><label><input name="mood" value="action" type="radio" required> I want action</label><label><input name="mood" value="feelings" type="radio"> I want feelings</label><label><input name="mood" value="wonder" type="radio"> I want wonder</label></div><div class="q"><strong>2. Choose your pace.</strong><label><input name="pace" value="fast" type="radio" required> Fast and intense</label><label><input name="pace" value="slow" type="radio"> Slow and atmospheric</label></div><div class="q"><strong>3. Pick a world.</strong><label><input name="world" value="new" type="radio" required> Something new</label><label><input name="world" value="classic" type="radio"> A modern classic</label></div><button class="button">REVEAL MY PICK →</button></form><div class="result" id="result" aria-live="polite"></div><a class="back" href="../">← Back to Dreaming Anime</a></main><script>document.getElementById('quiz').addEventListener('submit',function(e){e.preventDefault();var mood=new FormData(this).get('mood'),pick=mood==='feelings'?'Your Lie in April':mood==='wonder'?'Frieren: Beyond Journey’s End':'Demon Slayer: Kimetsu no Yaiba';var r=document.getElementById('result');r.innerHTML='<div class="eyebrow">YOUR DREAM MATCH</div><h2>'+pick+'</h2><p>That combination of mood and curiosity makes this a strong next watch. Explore the full Review Vault for more.</p><a class="back" href="../review/">ENTER THE REVIEW VAULT →</a>';r.style.display='block';r.scrollIntoView({behavior:'smooth',block:'center'});});</script></body></html>
